services:
  - type: web
    name: anubhavi-razorpay-abuse-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: python -m pip install -e '.[postgres]' && run-abuse-pipeline --output-root runs --run-id demo
    startCommand: export DATABASE_URL="${DATABASE_URL/postgresql:/postgresql+psycopg:}" && alembic upgrade head && load-detection-run runs/demo && uvicorn abuse_detector.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anubhavi-razorpay-abuse-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://anubhavi-razorpay-abuse.onrender.com

  - type: web
    name: anubhavi-razorpay-abuse
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://anubhavi-razorpay-abuse-api.onrender.com/api/v1

databases:
  - name: anubhavi-razorpay-abuse-db
    plan: free
    region: singapore
    databaseName: abuse_detector
    user: abuse_detector
    ipAllowList: []

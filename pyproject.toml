[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "razorpay-abuse-ring-detector"
version = "0.1.0"
description = "Coordinated promotional abuse detection using lightweight ML and graph analysis."
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "networkx==3.6.1",
    "scikit-learn==1.9.0",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.46.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.4"]

[project.scripts]
build-account-features = "abuse_detector.features:main"
detect-abuse-rings = "abuse_detector.graph:main"
generate-demo-data = "abuse_detector.data:main"
load-detection-run = "abuse_detector.db:main"
run-abuse-pipeline = "abuse_detector.pipeline:main"
train-account-model = "abuse_detector.model:main"

[tool.setuptools.packages.find]
where = ["src"]
